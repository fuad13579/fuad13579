<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="64" viewBox="0 0 420 64" role="img" aria-labelledby="title desc">
  <title id="title">Fuad Bin Sattar</title>
  <desc id="desc">A small Octocat-style GitHub mascot waves beside the name Fuad Bin Sattar as it types onto the screen.</desc>
  <style>
    :root{--text:#24292f;--accent:#2da44e;--muted:#8c959f;--metal:#57606a;--face:#f6f8fa}
    @media (prefers-color-scheme:dark){:root{--text:#c9d1d9;--accent:#3fb950;--muted:#6e7681;--metal:#8b949e;--face:#161b22}}
    .name{fill:var(--text);font:700 30px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.02em}
    .octo{fill:var(--metal);stroke:var(--text);stroke-width:1;stroke-linejoin:round}.octo-face{fill:var(--face)}.octo-line{fill:none;stroke:var(--metal);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.octo-eye{fill:var(--accent)}
  </style>
  <defs>
    <clipPath id="typing-window">
      <rect x="54" y="8" width="0" height="45">
        <animate attributeName="width" calcMode="discrete" dur="5.5s" repeatCount="indefinite"
          values="0;18;36;54;72;90;108;126;144;162;180;198;216;234;252;270;270;0"
          keyTimes="0;.035;.07;.105;.14;.175;.21;.245;.28;.315;.35;.385;.42;.455;.49;.525;.9;1"/>
      </rect>
    </clipPath>
  </defs>
  <path d="M28 51h364" stroke="var(--muted)" stroke-width="1" opacity=".35"/>
  <g transform="translate(24 9)" aria-label="Octocat-style mascot waving hello">
    <path class="octo" d="M5 10 7 3l6 4h5l6-4 2 7c3 3 4 7 3 12-1 6-6 9-11 9h-5C7 31 2 28 1 22c-1-5 1-9 4-12z"/>
    <ellipse class="octo-face" cx="15" cy="18" rx="10" ry="8"/>
    <circle class="octo-eye" cx="11" cy="17" r="1.5"/>
    <circle class="octo-eye" cx="19" cy="17" r="1.5">
      <animate attributeName="opacity" values="1;1;.15;1" keyTimes="0;.76;.81;1" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M13 21q2 2 4 0" fill="none" stroke="var(--metal)" stroke-width="1.2" stroke-linecap="round"/>
    <path class="octo" d="M9 29q6-3 12 0l2 10H7z"/>
    <path class="octo-line" d="M10 39v3m10-3v3m3-10 5 4"/>
    <path class="octo-line" d="M7 34q-5 0-5 4 0 3 4 3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 8 32;-25 8 32;14 8 32;-25 8 32;0 8 32" keyTimes="0;.22;.44;.66;1" dur="2.4s" repeatCount="indefinite"/>
      <path class="octo-line" d="M8 32 2 27 3 20"/>
      <circle class="octo" cx="3" cy="18" r="2.5"/>
      <path class="octo-line" d="M1 16-1 14m4 2v-3m2 3 2-2"/>
    </g>
  </g>
  <text class="name" x="54" y="42" textLength="270" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing-window)">Fuad Bin Sattar</text>
  <rect x="54" y="15" width="3" height="31" rx="1.5" fill="var(--accent)">
    <animate attributeName="x" calcMode="discrete" dur="5.5s" repeatCount="indefinite"
      values="54;72;90;108;126;144;162;180;198;216;234;252;270;288;306;324;324;54"
      keyTimes="0;.035;.07;.105;.14;.175;.21;.245;.28;.315;.35;.385;.42;.455;.49;.525;.9;1"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur=".9s" repeatCount="indefinite"/>
  </rect>
</svg>
