<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="64" viewBox="0 0 420 64" role="img" aria-labelledby="title desc">
  <title id="title">Fuad Bin Sattar</title>
  <desc id="desc">A small minimalist robot appears beside the name Fuad Bin Sattar as it types onto the screen.</desc>
  <style>
    :root{--text:#24292f;--accent:#2da44e;--muted:#8c959f;--metal:#57606a;--face:#f6f8fa}
    @media (prefers-color-scheme:dark){:root{--text:#c9d1d9;--accent:#3fb950;--muted:#6e7681;--metal:#8b949e;--face:#161b22}}
    .name{fill:var(--text);font:700 30px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.02em}
    .robot-fill{fill:var(--face);stroke:var(--metal);stroke-width:1.6}.robot-line{fill:none;stroke:var(--metal);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.robot-eye{fill:var(--accent)}
  </style>
  <defs>
    <clipPath id="typing-window">
      <rect x="70" y="8" width="0" height="45">
        <animate attributeName="width" calcMode="discrete" dur="5.5s" repeatCount="indefinite"
          values="0;18;36;54;72;90;108;126;144;162;180;198;216;234;252;270;270;0"
          keyTimes="0;.035;.07;.105;.14;.175;.21;.245;.28;.315;.35;.385;.42;.455;.49;.525;.9;1"/>
      </rect>
    </clipPath>
  </defs>
  <path d="M28 51h364" stroke="var(--muted)" stroke-width="1" opacity=".35"/>
  <g transform="translate(24 10)" aria-label="Minimalist robot">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="1.2s" repeatCount="indefinite"/>
      <path class="robot-line" d="M11 7V2m0 0L8-1m3 3 3-3"/>
      <rect class="robot-fill" x="2" y="7" width="18" height="15" rx="4"/>
      <g class="robot-eye">
        <circle cx="8" cy="13" r="1.6"/>
        <circle cx="14" cy="13" r="1.6"/>
        <animate attributeName="opacity" values="1;1;.15;1" keyTimes="0;.78;.82;1" dur="4s" repeatCount="indefinite"/>
      </g>
      <path class="robot-line" d="M5 23v3m12-3v3M2 15h-3m21 0h3"/>
      <path d="M5 22h12l4 15H1z" fill="var(--accent)" opacity=".07"><animate attributeName="opacity" values=".03;.11;.03" dur="2.4s" repeatCount="indefinite"/></path>
    </g>
  </g>
  <text class="name" x="70" y="42" textLength="270" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing-window)">Fuad Bin Sattar</text>
  <rect x="70" y="15" width="3" height="31" rx="1.5" fill="var(--accent)">
    <animate attributeName="x" calcMode="discrete" dur="5.5s" repeatCount="indefinite"
      values="70;88;106;124;142;160;178;196;214;232;250;268;286;304;322;340;340;70"
      keyTimes="0;.035;.07;.105;.14;.175;.21;.245;.28;.315;.35;.385;.42;.455;.49;.525;.9;1"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur=".9s" repeatCount="indefinite"/>
  </rect>
</svg>
